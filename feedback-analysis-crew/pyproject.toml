[tool.poetry]
name = "feedback-analysis-crew"
version = "0.1.0"
description = "CrewAI crew for analyzing customer feedback"
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
crewai = {extras = ["tools"], version = ">=0.80.0,<1.0.0"}

[tool.poetry.scripts]
feedback-analysis-crew = "feedback_analysis_crew.main:run"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
